[project]
name = "foresightbev"
version = "0.1.0"
description = "ForesightBEV: Metric 3D Bird's-Eye-View Geometric Perception and World Modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
